name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.9.5", enable-cache: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: uv sync --frozen --extra dev
      - run: uv lock --check
      - run: uv run ruff check src tests scripts
      - run: uv run python scripts/validate_grafana_queries.py
      - run: uv run pytest tests/unit tests/contract --cov=house_price --cov-report=xml

  integration:
    runs-on: ubuntu-latest
    needs: quality
    env:
      POSTGRES_DB: house_price
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-postgres-password
      MIGRATION_PASSWORD: ci-migration-password
      PIPELINE_PASSWORD: ci-pipeline-password
      GRAFANA_PASSWORD: ci-grafana-password
      DATABASE_URL: postgresql+psycopg://pipeline_writer:ci-pipeline-password@127.0.0.1:5432/house_price
      OPTUNA_STORAGE_URL: postgresql+psycopg://pipeline_writer:ci-pipeline-password@127.0.0.1:5432/optuna
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg://postgres:ci-postgres-password@postgres:5432/mlflow
      MIGRATION_DATABASE_URL: postgresql+psycopg://migration_user:ci-migration-password@127.0.0.1:5432/house_price
      GRAFANA_DATABASE_URL: postgresql+psycopg://grafana_reader:ci-grafana-password@127.0.0.1:5432/house_price
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.9.5", enable-cache: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: uv sync --frozen --extra dev
      - run: docker compose up -d postgres
      - run: uv run alembic upgrade head
      - run: uv run python scripts/validate_grafana_queries.py
      - run: uv run pytest tests/integration -m "not docker"
      - if: always()
        run: docker compose down

  performance:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.9.5", enable-cache: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: uv sync --frozen --extra dev
      - run: uv run pytest tests/performance

  images:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example build trainer inference mlflow

